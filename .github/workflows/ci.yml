# Build, test and package TableMap (ADR 0029).
#
# Every push and pull request: the full gate (typecheck, lint, unit, e2e),
# then the Windows and macOS desktop apps are packaged and smoke-tested, and
# the installers are attached to the run as artifacts.
#
# Pushing a tag like `v1.2.0` also publishes a GitHub Release with the
# installers attached, versioned from the tag:
#   git tag v1.2.0 && git push origin v1.2.0
# The release also carries the auto-update feed (ADR 0031): `latest.yml`
# (Windows) and `latest-mac.yml` with the zips and blockmaps they point at.
# Installed apps read the newest published release, so the repository must
# be public and the release must not be a draft or a pre-release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Typecheck, lint, unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The web gates never launch Electron; skip its ~100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            feed: latest.yml
          - name: macOS
            os: macos-latest
            feed: latest-mac.yml
    env:
      # No Apple Developer ID: the mac build is ad-hoc signed (see package.json "build.mac").
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run desktop:dist
      - name: Smoke-test the packaged app
        run: npm run desktop:smoke
      - name: Check the update feed was generated
        shell: bash
        run: |
          test -f "release/${{ matrix.feed }}"
          cat "release/${{ matrix.feed }}"
      - uses: actions/upload-artifact@v7
        with:
          name: TableMap-${{ matrix.name }}
          path: |
            app/release/${{ matrix.feed }}
            app/release/TableMap-*.exe
            app/release/TableMap-*.dmg
            app/release/TableMap-*.zip
            app/release/TableMap-*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: TableMap-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --title "TableMap $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat .github/release-notes.md)"
